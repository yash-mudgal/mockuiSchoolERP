<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Springdale International School Group — enterprise School ERP. Admissions, academics, fees, transport, hostel, HR and analytics across five campuses.">
  <title>Springdale ERP — School Management Platform</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236041e0'/%3E%3Cpath d='M16 7l10 5-10 5-10-5z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M10 14v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/charts.css">

  <script>
    /* Stamp the stored theme/density before first paint to avoid a flash. */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('springdale.erp.v1') || '{}');
        var theme = saved.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-density', saved.density || 'comfortable');
      } catch (e) { /* storage blocked — defaults already on <html> */ }
    })();
  </script>

  <style>
    /* First-paint splash, replaced by app.js as soon as the modules load. */
    #boot-splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: var(--canvas, #f7f9fb); z-index: 999;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot-splash .bs-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #boot-splash .bs-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(140deg, var(--brand-500, #6f5cee), var(--brand-700, #5232c5) 70%);
      display: grid; place-items: center; color: var(--on-brand, #fff);
    }
    #boot-splash .bs-bar {
      width: 160px; height: 3px; border-radius: 3px; overflow: hidden;
      background: var(--chart-track, rgba(124, 135, 153, 0.22));
    }
    #boot-splash .bs-bar i {
      display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--brand-600, #6041e0);
      animation: bs-slide 1.1s ease-in-out infinite;
    }
    @keyframes bs-slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(300%) } }
    #boot-splash .bs-text { font-size: 12px; color: var(--text-muted, #7c8799); letter-spacing: 0.04em; }

    .boot-error {
      max-width: 620px; margin: 12vh auto; padding: 28px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      border: 1px solid var(--border, #e3e8ef); border-radius: 12px; background: var(--surface, #fff); color: var(--text, #232a34);
      line-height: 1.55;
    }
    .boot-error h1 { font-size: 20px; margin: 0 0 10px; }
    .boot-error code { background: var(--surface-sunken, #f7f9fb); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .boot-error ol { padding-left: 20px; }
  </style>
</head>
<body>
  <a class="sr-only" href="#main-content">Skip to main content</a>

  <div id="app"></div>

  <div id="boot-splash" aria-hidden="true">
    <div class="bs-inner">
      <div class="bs-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 4 10 5-10 5L2 9Z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>
        </svg>
      </div>
      <div class="bs-bar"><i></i></div>
      <div class="bs-text">Loading Springdale ERP…</div>
    </div>
  </div>

  <noscript>
    <div class="boot-error">
      <h1>JavaScript is required</h1>
      <p>Springdale ERP is a single-page application. Enable JavaScript in your browser and reload this page.</p>
    </div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>

  <script>
    /* ES modules require http(s):// — file:// is blocked by CORS. */
    if (location.protocol === 'file:') {
      document.getElementById('boot-splash').remove();
      document.getElementById('app').innerHTML =
        '<div class="boot-error">' +
        '<h1>Please open this app over http://</h1>' +
        '<p>You opened <code>index.html</code> directly from the file system. Browsers block ES modules on <code>file://</code>, so the app cannot start.</p>' +
        '<p><strong>Start it with the bundled launcher:</strong></p>' +
        '<ol>' +
        '<li>Double-click <code>start.bat</code> in this folder, or</li>' +
        '<li>run <code>python serve.py</code>, or</li>' +
        '<li>run <code>npx serve -l 5173</code></li>' +
        '</ol>' +
        '<p>Then open <code>http://localhost:5173</code>.</p>' +
        '</div>';
    } else {
      /* Remove the splash once the module has booted (or after a timeout). */
      var removeSplash = function () {
        var s = document.getElementById('boot-splash');
        if (s) s.remove();
      };
      var check = setInterval(function () {
        if (document.getElementById('app').childNodes.length) { clearInterval(check); removeSplash(); }
      }, 60);
      setTimeout(function () { clearInterval(check); removeSplash(); }, 6000);
      window.addEventListener('error', function (e) {
        if (!document.getElementById('app').childNodes.length) {
          removeSplash();
          document.getElementById('app').innerHTML =
            '<div class="boot-error"><h1>The app failed to start</h1><p><code>' +
            String(e.message || e).replace(/[<>&]/g, '') +
            '</code></p><p>Open the browser console for the full stack trace.</p></div>';
        }
      });
    }
  </script>
</body>
</html>
